<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production SaaS Analytics Platform</title>
  <link rel="stylesheet" href="/assets/tailwind-built.css">
  <link rel="preload" href="/assets/main-chunk-8a2f.js" as="script">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
  <div id="root" class="flex flex-col min-h-screen">
    <!-- Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
            <span class="text-emerald-400 font-bold text-sm">SS</span>
          </div>
          <span class="font-semibold text-white tracking-tight">CloudPulse Analytics</span>
        </div>
        <div class="flex items-center space-x-4">
          <span class="text-xs px-2.5 py-1 rounded-full font-medium bg-emerald-950 text-emerald-400 border border-emerald-800/40">
            Production Cluster
          </span>
          <button class="px-3.5 py-1.5 text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg shadow-sm ring-2 ring-indigo-400/30 transition-all focus:outline-none">
            New Project
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Metric Card 1 -->
        <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800/80 shadow-sm hover:border-slate-700 transition-colors">
          <div class="flex items-center justify-between">
            <span class="text-sm font-medium text-slate-400">Total Ingestion Rate</span>
            <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 font-semibold">+18.2%</span>
          </div>
          <p class="mt-4 text-3xl font-bold tracking-tight text-white">4.82M req/s</p>
          <div class="mt-3 w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
            <div class="bg-emerald-500 h-1.5 rounded-full w-[78%]"></div>
          </div>
        </div>

        <!-- Metric Card 2 -->
        <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800/80 shadow-sm hover:border-slate-700 transition-colors">
          <div class="flex items-center justify-between">
            <span class="text-sm font-medium text-slate-400">Edge Compute P95</span>
            <span class="text-xs px-2 py-0.5 rounded bg-sky-500/10 text-sky-400 font-semibold">-4.1ms</span>
          </div>
          <p class="mt-4 text-3xl font-bold tracking-tight text-white">12.4 ms</p>
          <p class="mt-3 text-xs text-slate-500">Across 28 edge locations</p>
        </div>

        <!-- Metric Card 3 -->
        <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800/80 shadow-sm hover:border-slate-700 transition-colors">
          <div class="flex items-center justify-between">
            <span class="text-sm font-medium text-slate-400">Memory Utilization</span>
            <span class="text-xs px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 font-semibold">Nominal</span>
          </div>
          <p class="mt-4 text-3xl font-bold tracking-tight text-white">64.1%</p>
          <div class="mt-3 w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
            <div class="bg-amber-400 h-1.5 rounded-full w-[64%]"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/assets/main-chunk-8a2f.js"></script>
</body>
</html>
